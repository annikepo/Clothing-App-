<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Mobile Clothing App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <span class="logo-text">SIDEWAYS SHOP</span>
        </header>

        <h2 class="section-title">ALL PRODUCTS</h2>

        <div class="product-scroll" style="flex-wrap: wrap;">
            <div class="product-card">
                <div class="img-wrapper">
                    <img src="images/Image (Static Motion Tee).png" alt="Static Motion Tee">
                </div>
                <div class="card-info">
                    <h3>Static Motion Tee</h3>
                    <p class="price">$42</p>
                </div>
            </div>

            <div class="product-card">
                <div class="img-wrapper">
                    <img src="images/Image (Concrete Flow Deck).png" alt="Concrete Flow Deck">
                </div>
                <div class="card-info">
                    <h3>Concrete Flow Deck</h3>
                    <p class="price">$88</p>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">Home</a>
            <a href="page2.html" class="nav-item active">Shop</a>
        </nav>
    </div>
</body>
</html>
